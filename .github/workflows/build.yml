name: Build Kindle Cookbook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OpenAI Cookbook
        uses: actions/checkout@v4
        with:
          repository: openai/openai-cookbook
          path: cookbook

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install nbformat

          echo "Pandoc:"
          pandoc --version | head -1

      - name: Prepare notebooks
        run: |
          mkdir -p cleaned

          python <<'PY'
          from pathlib import Path
          import nbformat

          source = Path("cookbook")
          destination = Path("cleaned")

          good = []
          failed = []

          notebooks = sorted(
              list((source / "articles").rglob("*.ipynb")) +
              list((source / "examples").rglob("*.ipynb"))
          )

          print(f"Found {len(notebooks)} notebooks")

          for notebook in notebooks:
              relative = notebook.relative_to(source)

              if ".ipynb_checkpoints" in relative.parts:
                  continue

              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)

              try:
                  nb = nbformat.read(notebook, as_version=4)

                  # Remove unnecessary notebook metadata.
                  nb.metadata = {}

                  for cell in nb.cells:
                      cell.metadata = {}

                      if cell.cell_type != "code":
                          continue

                      cell.execution_count = None

                      # Trim exceptionally large textual outputs.
                      for output in cell.get("outputs", []):
                          if output.get("output_type") == "stream":
                              text = output.get("text", "")

                              if isinstance(text, list):
                                  text = "".join(text)

                              if len(text) > 10000:
                                  output["text"] = (
                                      text[:10000]
                                      + "\n\n[Output truncated for Kindle edition]"
                                  )

                          data = output.get("data", {})

                          if isinstance(data, dict):
                              for key in [
                                  "text/plain",
                                  "text/markdown",
                                  "text/html"
                              ]:
                                  value = data.get(key)

                                  if isinstance(value, list):
                                      value = "".join(value)

                                  if (
                                      isinstance(value, str)
                                      and len(value) > 10000
                                  ):
                                      data[key] = (
                                          value[:10000]
                                          + "\n\n[Output truncated for Kindle edition]"
                                      )

                  nbformat.write(nb, target)

                  good.append(str(target))
                  print("OK  ", relative)

              except Exception as error:
                  failed.append((str(relative), str(error)))
                  print("SKIP", relative, error)

          Path("notebooks.txt").write_text(
              "\n".join(good) + "\n",
              encoding="utf-8"
          )

          Path("prepare-failures.txt").write_text(
              "\n".join(
                  f"{filename}: {error}"
                  for filename, error in failed
              ),
              encoding="utf-8"
          )

          print()
          print("Preparation summary")
          print("-------------------")
          print(f"Found:    {len(notebooks)}")
          print(f"Prepared: {len(good)}")
          print(f"Failed:   {len(failed)}")

          if not good:
              raise SystemExit("No notebooks could be prepared")
          PY

      - name: Convert notebooks to Markdown
        run: |
          mkdir -p markdown

          SUCCESS=0
          FAILED=0
          TIMED_OUT=0

          : > markdown-files.txt
          : > failed-notebooks.txt
          : > timed-out-notebooks.txt

          while IFS= read -r NOTEBOOK
          do
            [ -z "$NOTEBOOK" ] && continue

            RELATIVE="${NOTEBOOK#cleaned/}"
            OUTPUT="markdown/${RELATIVE%.ipynb}.md"

            mkdir -p "$(dirname "$OUTPUT")"

            echo
            echo "========================================"
            echo "Converting: $RELATIVE"
            echo "========================================"

            set +e

            timeout 30s pandoc \
              "$NOTEBOOK" \
              -f ipynb \
              -t markdown \
              --wrap=none \
              -o "$OUTPUT"

            RESULT=$?

            set -e

            if [ "$RESULT" -eq 0 ]; then
              echo "$OUTPUT" >> markdown-files.txt
              SUCCESS=$((SUCCESS + 1))

              echo "SUCCESS: $RELATIVE"

            elif [ "$RESULT" -eq 124 ]; then
              rm -f "$OUTPUT"

              echo "$RELATIVE" >> timed-out-notebooks.txt
              TIMED_OUT=$((TIMED_OUT + 1))

              echo "TIMEOUT: $RELATIVE"

            else
              rm -f "$OUTPUT"

              echo "$RELATIVE" >> failed-notebooks.txt
              FAILED=$((FAILED + 1))

              echo "FAILED: $RELATIVE (exit code $RESULT)"
            fi

          done < notebooks.txt

          echo
          echo "========================================"
          echo "Markdown conversion summary"
          echo "========================================"
          echo "Converted: $SUCCESS"
          echo "Failed:    $FAILED"
          echo "Timed out: $TIMED_OUT"

          if [ "$SUCCESS" -eq 0 ]; then
            echo "No notebooks were successfully converted."
            exit 1
          fi

      - name: Create front page
        run: |
          SHA=$(git -C cookbook rev-parse HEAD)
          DATE=$(git -C cookbook show -s --format=%cs HEAD)
          COUNT=$(wc -l < markdown-files.txt)

          cat > intro.md <<EOF
          # OpenAI Cookbook

          Kindle edition generated from the OpenAI Cookbook.

          **Upstream version:** $DATE

          **Upstream commit:** \`$SHA\`

          **Notebooks included:** $COUNT

          This ebook was automatically generated from the Jupyter
          notebooks in the OpenAI Cookbook repository.

          ---
          EOF

      - name: Build EPUB
        run: |
          mapfile -t MARKDOWN_FILES < markdown-files.txt

          echo "Building EPUB from ${#MARKDOWN_FILES[@]} notebooks..."

          pandoc \
            intro.md \
            "${MARKDOWN_FILES[@]}" \
            -f markdown \
            -t epub3 \
            --standalone \
            --toc \
            --toc-depth=2 \
            --metadata title="OpenAI Cookbook" \
            --metadata author="OpenAI" \
            --metadata lang="en-GB" \
            -o OpenAI-Cookbook.epub

          echo
          echo "EPUB successfully created:"
          ls -lh OpenAI-Cookbook.epub

      - name: Create build report
        if: always()
        run: |
          {
            echo "# OpenAI Cookbook EPUB Build Report"
            echo
            echo "Build date: $(date -u)"
            echo
            echo "Upstream commit: $(git -C cookbook rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            echo "Prepared notebooks: $(wc -l < notebooks.txt 2>/dev/null || echo 0)"
            echo "Converted notebooks: $(wc -l < markdown-files.txt 2>/dev/null || echo 0)"
            echo "Failed conversions: $(wc -l < failed-notebooks.txt 2>/dev/null || echo 0)"
            echo "Timed-out conversions: $(wc -l < timed-out-notebooks.txt 2>/dev/null || echo 0)"

            if [ -s timed-out-notebooks.txt ]; then
              echo
              echo "## Timed-out notebooks"
              echo
              cat timed-out-notebooks.txt
            fi

            if [ -s failed-notebooks.txt ]; then
              echo
              echo "## Failed notebooks"
              echo
              cat failed-notebooks.txt
            fi

            if [ -s prepare-failures.txt ]; then
              echo
              echo "## Preparation failures"
              echo
              cat prepare-failures.txt
            fi

          } > build-report.md

          cat build-report.md

      - name: Upload Kindle EPUB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAI-Cookbook-Kindle
          path: OpenAI-Cookbook.epub
          if-no-files-found: error
          retention-days: 30

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAI-Cookbook-Build-Report
          path: |
            build-report.md
            prepare-failures.txt
            failed-notebooks.txt
            timed-out-notebooks.txt
          if-no-files-found: ignore
          retention-days: 30
